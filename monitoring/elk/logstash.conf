# Logstash configuration for EMR log aggregation
input {
  # Application logs from services
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["emr-application-logs", "emr-audit-logs", "emr-security-logs"]
    codec => json
    consumer_threads => 3
    decorate_events => true
    group_id => "logstash-emr-consumer"
    auto_offset_reset => "latest"
    security_protocol => "SSL"
    ssl_truststore_location => "/usr/share/logstash/config/certs/kafka-truststore.jks"
    ssl_keystore_location => "/usr/share/logstash/config/certs/kafka-keystore.jks"
    ssl_keystore_password => "${KAFKA_KEYSTORE_PASSWORD}"
    ssl_truststore_password => "${KAFKA_TRUSTSTORE_PASSWORD}"
  }

  # System logs
  syslog {
    port => 514
    type => "system"
  }

  # Filebeat inputs for container logs
  beats {
    port => 5044
    ssl => true
    ssl_certificate => "/usr/share/logstash/config/certs/logstash.crt"
    ssl_key => "/usr/share/logstash/config/certs/logstash.key"
    ssl_verify_mode => "force_peer"
  }

  # HTTP input for direct log ingestion
  http {
    port => 8080
    ssl => true
    ssl_certificate => "/usr/share/logstash/config/certs/logstash.crt"
    ssl_key => "/usr/share/logstash/config/certs/logstash.key"
    ssl_verify_mode => "force_peer"
  }
}

filter {
  # Parse JSON logs
  if [message] =~ /^\{/ {
    json {
      source => "message"
      remove_field => ["message"]
    }
  }

  # Parse log levels
  grok {
    match => {
      "level" => "(?i)(TRACE|DEBUG|INFO|WARN|WARNING|ERROR|FATAL)"
    }
    add_tag => ["%{level}"]
  }

  # Parse timestamps
  date {
    match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss,SSS", "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"]
    target => "@timestamp"
    remove_field => ["timestamp"]
  }

  # Extract service information
  grok {
    match => {
      "source" => "%{WORD:service}-%{WORD:component}"
    }
  }

  # Parse application logs
  if [type] == "application" {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:log_timestamp} %{LOGLEVEL:level} %{DATA:logger} - %{GREEDYDATA:log_message}"
      }
      overwrite => ["message"]
    }

    # Extract MDC fields
    grok {
      match => {
        "mdc" => "userId=%{WORD:user_id},sessionId=%{WORD:session_id},requestId=%{WORD:request_id}"
      }
    }
  }

  # Parse audit logs
  if [type] == "audit" {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:audit_timestamp} %{WORD:user} %{WORD:action} %{DATA:resource} %{DATA:result}"
      }
    }

    # HIPAA compliance tagging
    if [resource] =~ /patient|medical|phi/i {
      mutate {
        add_tag => ["hipaa", "sensitive"]
      }
    }
  }

  # Parse security logs
  if [type] == "security" {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:event_timestamp} %{WORD:event_type} %{IP:client_ip} %{WORD:user} %{DATA:details}"
      }
    }

    # GeoIP enrichment
    geoip {
      source => "client_ip"
      target => "geoip"
    }

    # Threat intelligence
    if [event_type] == "failed_login" {
      mutate {
        add_tag => ["security_threat"]
      }
    }
  }

  # System logs
  if [type] == "system" {
    grok {
      match => {
        "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:hostname} %{DATA:program}: %{GREEDYDATA:syslog_message}"
      }
    }
  }

  # Add common fields
  mutate {
    add_field => {
      "environment" => "${ENVIRONMENT:-production}"
      "cluster" => "${CLUSTER_NAME:-emr-cluster}"
      "region" => "${REGION:-us-east-1}"
    }
  }

  # Anonymize sensitive data
  mutate {
    gsub => [
      "message", "(?i)password\s*[:=]\s*\S+", "password:=***",
      "message", "(?i)ssn\s*[:=]\s*\d{3}-\d{2}-\d{4}", "ssn:=***-**-****",
      "message", "(?i)credit_card\s*[:=]\s*\d{4}-\d{4}-\d{4}-\d{4}", "credit_card:=****-****-****-****"
    ]
  }

  # Drop debug logs in production
  if [environment] == "production" and [level] == "DEBUG" {
    drop {}
  }

  # Rate limiting for noisy logs
  throttle {
    before_count => 100
    after_count => 10
    period => 300
    key => "%{message}"
    add_tag => "throttled"
  }
}

output {
  # Main Elasticsearch output
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    user => "${ELASTICSEARCH_USER}"
    password => "${ELASTICSEARCH_PASSWORD}"
    ssl => true
    ssl_certificate_verification => true
    cacert => "/usr/share/logstash/config/certs/ca.crt"
    index => "emr-%{+YYYY.MM.dd}"
    document_type => "%{[@metadata][type]}"
    template => "/usr/share/logstash/config/elasticsearch-template.json"
    template_name => "emr-log-template"
    template_overwrite => true
    ilm_enabled => true
    ilm_rollover_alias => "emr-logs"
    ilm_pattern => "{now/d}-000001"
    ilm_policy => "emr-log-policy"
  }

  # Security events to separate index
  if "security" in [tags] {
    elasticsearch {
      hosts => ["https://elasticsearch:9200"]
      user => "${ELASTICSEARCH_USER}"
      password => "${ELASTICSEARCH_PASSWORD}"
      ssl => true
      ssl_certificate_verification => true
      cacert => "/usr/share/logstash/config/certs/ca.crt"
      index => "emr-security-%{+YYYY.MM.dd}"
      document_type => "security_event"
    }
  }

  # Audit logs to separate index
  if "audit" in [tags] {
    elasticsearch {
      hosts => ["https://elasticsearch:9200"]
      user => "${ELASTICSEARCH_USER}"
      password => "${ELASTICSEARCH_PASSWORD}"
      ssl => true
      ssl_certificate_verification => true
      cacert => "/usr/share/logstash/config/certs/ca.crt"
      index => "emr-audit-%{+YYYY.MM.dd}"
      document_type => "audit_event"
    }
  }

  # Error logs to separate index
  if [level] == "ERROR" or [level] == "FATAL" {
    elasticsearch {
      hosts => ["https://elasticsearch:9200"]
      user => "${ELASTICSEARCH_USER}"
      password => "${ELASTICSEARCH_PASSWORD}"
      ssl => true
      ssl_certificate_verification => true
      cacert => "/usr/share/logstash/config/certs/ca.crt"
      index => "emr-errors-%{+YYYY.MM.dd}"
      document_type => "error_event"
    }
  }

  # Send alerts for critical errors
  if [level] == "ERROR" and "critical" in [tags] {
    email {
      to => "${ALERT_EMAIL}"
      from => "logstash@emr-system.com"
      subject => "EMR Critical Error Alert: %{source}"
      body => "Critical error detected in %{source}:\n\n%{message}\n\nTimestamp: %{@timestamp}\nService: %{service}\nLevel: %{level}"
      smtp => {
        address => "${SMTP_SERVER}"
        port => 587
        username => "${SMTP_USER}"
        password => "${SMTP_PASSWORD}"
        authentication => "plain"
        enable_starttls_auto => true
      }
    }
  }

  # Debug output (only in development)
  if [environment] != "production" {
    stdout {
      codec => rubydebug
    }
  }
}