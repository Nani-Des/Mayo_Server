apiVersion: v1
kind: ServiceAccount
metadata:
  name: emr-gateway-sa
  namespace: emr-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: emr-audit-sa
  namespace: emr-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: emr-sync-sa
  namespace: emr-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: emr-gateway-role
  namespace: emr-system
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: emr-audit-role
  namespace: emr-system
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: emr-admin-cluster-role
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/proxy"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: emr-monitoring-cluster-role
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: emr-gateway-binding
  namespace: emr-system
subjects:
- kind: ServiceAccount
  name: emr-gateway-sa
  namespace: emr-system
roleRef:
  kind: Role
  name: emr-gateway-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: emr-audit-binding
  namespace: emr-system
subjects:
- kind: ServiceAccount
  name: emr-audit-sa
  namespace: emr-system
roleRef:
  kind: Role
  name: emr-audit-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: emr-admin-binding
subjects:
- kind: User
  name: emr-admin
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: emr-admin-cluster-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: emr-monitoring-binding
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: monitoring
roleRef:
  kind: ClusterRole
  name: emr-monitoring-cluster-role
  apiGroup: rbac.authorization.k8s.io