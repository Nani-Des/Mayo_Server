server:
  port: 8443
  ssl:
    enabled: false
    key-store: classpath:certs/server/keystore.p12
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: server
    trust-store: classpath:certs/ca/ca.crt
    trust-store-type: PEM
    client-auth: need
    protocol: TLS
    enabled-protocols: TLSv1.3,TLSv1.2
    ciphers: TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256
  security:
    user:
      password: dev_only_placeholder # Suppress generated password warning

spring:
  application:
    name: gateway
  output:
    ansi:
      enabled: ALWAYS

  main:
    web-application-type: reactive

  cloud:
    gateway:
      routes:
        # Auth Service Routes
        - id: auth-service
          uri: http://localhost:8451
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0

        # Patient Service Routes
        - id: patient-service
          uri: http://localhost:8445
          predicates:
            - Path=/api/v1/patients/**
          filters:
            - StripPrefix=0

        # Patient Record Service Routes (patient-record-service)
        - id: patient-record-service
          uri: http://localhost:8445
          predicates:
            - Path=/api/v1/patient-records/**
          filters:
            - StripPrefix=0

        # Lab Results Routes (patient-record-service)
        - id: patient-record-service-lab-results
          uri: http://localhost:8445
          predicates:
            - Path=/api/v1/lab-results/**
          filters:
            - StripPrefix=0

        # Device Registry Service Routes (Port 8084)
        - id: device-registry-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/devices/**, /api/v1/admin/devices/**
          filters:
            - StripPrefix=0

        # Hospital Integration Service Routes
        - id: hospital-integration-service
          uri: http://localhost:8447
          predicates:
            - Path=/api/v1/hospital/**
          filters:
            - StripPrefix=0

        # GraphQL Routes
        - id: graphql-service
          uri: http://localhost:8447
          predicates:
            - Path=/graphql/**
          filters:
            - StripPrefix=0

        # Sync Service Routes
        - id: sync-service
          uri: http://localhost:8448
          predicates:
            - Path=/api/v1/sync/**
          filters:
            - StripPrefix=0

        # Audit Service Routes
        - id: audit-service
          uri: http://localhost:8449
          predicates:
            - Path=/api/v1/audit/**
          filters:
            - StripPrefix=0

        # Hospital Integration Support Routes (Non-Conflicting)
        - id: hospital-integration-service-hospitals
          uri: http://localhost:8447
          predicates:
            - Path=/api/v1/hospitals/**
          filters:
            - StripPrefix=0

        - id: hospital-integration-service-transfers
          uri: http://localhost:8447
          predicates:
            - Path=/api/v1/transfers/**
          filters:
            - StripPrefix=0

        # Notification Service Routes
        - id: notification-service
          uri: http://localhost:8450
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - StripPrefix=0

        # Appointment Service Routes
        - id: appointment-service
          uri: http://localhost:8452
          predicates:
            - Path=/api/v1/appointments/**
          filters:
            - StripPrefix=0

      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            redis-rate-limiter.requestedTokens: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:changeme-this-is-not-secure-for-production-use-at-least-64-characters-long}

# Gateway Secret (for service authentication)
gateway:
  secret: ${GATEWAY_SECRET:d9f8a7b6c5e4d3c2b1a0987654321fedcba0123456789abcdef}


logging:
  level:
    root: INFO
    com.mayo: DEBUG
    org.springframework.cloud.gateway: DEBUG
    io.github.resilience4j: INFO
    io.github.resilience4j.circuitbreaker: INFO
    io.github.resilience4j.circuitbreaker.CircuitBreaker: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %highlight(%-5level) %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Eureka Client Configuration (Disabled - not currently used)
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: false
    fetch-registry: false
    enabled: false
  instance:
    hostname: localhost

# Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  health:
    circuitbreakers:
      enabled: true

# Resilience4j Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    config:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
    instances:
      hospital-service-circuit-breaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        recordExceptions:
          - java.io.IOException

          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientResponseException
        ignoreExceptions:
          - org.springframework.cloud.gateway.support.NotFoundException
      sync-service-circuit-breaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
      graphql-service-circuit-breaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50

  reactor:
    filterEnabled: true
